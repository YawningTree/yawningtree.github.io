      <text x="125" y="332" font-size="17" fill="#6f6a5c" text-anchor="middle">Markdown 编辑</text>
    </g>
    <g>
      <rect x="330" y="210" width="230" height="160" rx="28" fill="#fbfaf6" stroke="#e5e0d3" stroke-width="2"/>
      <circle cx="366" cy="246" r="17" fill="#7d8a6f"/>
      <text x="366" y="252" font-size="19" fill="#f8f6f1" text-anchor="middle" font-family="'PingFang SC','Helvetica Neue',sans-serif">2</text>
      <text x="445" y="300" font-size="25" fill="#3b3830" text-anchor="middle">本地预览</text>
      <text x="445" y="332" font-size="17" fill="#6f6a5c" text-anchor="middle">hugo server</text>
    </g>
    <g>
      <rect x="650" y="210" width="230" height="160" rx="28" fill="#fbfaf6" stroke="#e5e0d3" stroke-width="2"/>
      <circle cx="686" cy="246" r="17" fill="#7d8a6f"/>
