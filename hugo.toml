baseURL = "https://yawningtree.github.io/"
theme = "yawningtree"
locale = "zh-cn"
timeZone = "Asia/Shanghai"
title = "打哈欠的树"
enableRobotsTXT = true
publishDir = "public"
summaryLength = 60

[params]
  author = "Tree"
  description = "Tree 的自娱自乐赛博花园。"
  tagline = "一棵无聊的树，随便记录点什么。（未应用）"
  since = 2019

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      autoHeadingID = true
  [markup.highlight]
    codeFences = true
    lineNos = false
    noClasses = false

[taxonomies]
  tag = "tags"
