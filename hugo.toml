baseURL = "https://yawningtree.github.io/"
theme = "yawningtree"
locale = "zh-cn"
title = "打哈欠的树"
enableRobotsTXT = true
publishDir = "public"
summaryLength = 60

[params]
  author = "Tree"
  description = "Tree 的个人数字花园 —— 记录学习、研究、生活与思想。"
  tagline = "一棵慢慢生长的树，记录学习、研究、生活与思想。"
  since = 2026

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      autoHeadingID = true
  [markup.highlight]
    codeFences = true
    lineNos = false
    noClasses = false

[taxonomies]
  tag = "tags"
