{{ $sec := "" }}
{{ if .IsHome }}{{ $sec = "home" }}{{ else if eq .Section "articles" }}{{ $sec = "articles" }}{{ else if eq .Section "notes" }}{{ $sec = "notes" }}{{ else if eq .Params.navkey "about" }}{{ $sec = "about" }}{{ end }}
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "" | relURL }}">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="13" r="9" fill="currentColor" opacity=".9"/><path d="M15 20h2v8h-2z" fill="currentColor" opacity=".7"/></svg>
      <span class="brand-name">打哈欠的树</span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a class="{{ if eq $sec "home" }}active{{ end }}" href="{{ "" | relURL }}">首页</a>
      <a class="{{ if eq $sec "articles" }}active{{ end }}" href="{{ "articles/" | relURL }}">文章</a>
      <a class="{{ if eq $sec "notes" }}active{{ end }}" href="{{ "notes/" | relURL }}">随记</a>
      <a class="{{ if eq $sec "about" }}active{{ end }}" href="{{ "about/" | relURL }}">关于</a>
    </nav>
  </div>
</header>
