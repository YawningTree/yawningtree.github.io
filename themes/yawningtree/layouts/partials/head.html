<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ $t := .Title }}{{ if and (eq .Section "notes") (not $t) }}{{ $t = .Date.Format "2006-01-02" }}{{ end }}{{ with $t }}{{ . }} · {{ end }}{{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="icon" href="{{ "favicon.svg?v=3" | absURL }}" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="1024x1024" href="{{ "apple-touch-icon-1024.png?v=2" | absURL }}">
{{ with .OutputFormats.Get "rss" -}}
  {{ printf `<link rel="%s" type="%s" href="%s" title="%s">` .Rel .MediaType.Type .Permalink $.Site.Title | safeHTML }}
{{ end -}}
<link rel="stylesheet" href="{{ "css/style.css" | absURL }}">
