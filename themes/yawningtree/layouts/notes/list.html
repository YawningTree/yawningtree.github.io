{{ define "main" }}
<header class="page-head">
  <h1>随记</h1>
  <p class="muted">一些灵光。</p>
</header>
<section class="notes-feed">
  {{ range .Pages.ByDate.Reverse }}
    <article class="note-item">
      <div class="note-meta">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
        {{ if .Params.tags }}<span class="meta-sep"> · </span>{{ partial "tags.html" . }}{{ end }}
      </div>
      {{ if .Params.title }}<h2 class="note-title"><a href="{{ .RelPermalink }}">{{ .Params.title }}</a></h2>{{ end }}
      <div class="timeline-note">{{ .Content }}</div>
    </article>
  {{ else }}
    <p class="muted">还没有随记。</p>
  {{ end }}
</section>
{{ end }}
