{{ define "main" }}
<article class="note-single">
  <header class="post-header">
    {{ if .Params.title }}<h1>{{ .Params.title }}</h1>{{ end }}
    {{ partial "meta.html" . }}
  </header>
  <div class="prose">{{ .Content }}</div>
  <footer class="post-footer">
    <nav class="post-nav">
      {{ with .PrevInSection }}<a class="prev" href="{{ .RelPermalink }}">← 之前的事</a>{{ end }}
      {{ with .NextInSection }}<a class="next" href="{{ .RelPermalink }}">接下来 →</a>{{ end }}
    </nav>
  </footer>
</article>
{{ end }}
